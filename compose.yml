
version: '3.8'

services:
  ifheroes_warehouse:
    image: ghcr.io/chrischivlog/warehouse:test
    container_name: Ifheroes_player_warehouse_test
    ports:
      - "8081:8081"
    volumes:
      - ./v1:/var/www/html
      - ./apache_logs:/var/log/apache2
      - ./sec:/var/www/html/sec/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    